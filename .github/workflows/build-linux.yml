name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "build_linux.sh"
      - ".github/workflows/build-linux.yml"
      - "assets/**"

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system audio libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg python3-tk

      - name: Smoke tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install torch==2.6.0 torchaudio==2.6.0
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m py_compile pipeline.py gui.py community_training.py train_reference_model.py model_manager.py install_optional.py installer/bootstrap_installer_linux.py
          .venv/bin/python -m unittest discover -s tests

      - name: Build Linux archive
        run: bash build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: V-D-Splitter-linux
          path: dist/V-D-Splitter-linux.tar.gz
