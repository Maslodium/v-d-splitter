name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "build_macos.sh"
      - ".github/workflows/build-macos.yml"
      - "assets/**"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install torch==2.6.0 torchaudio==2.6.0
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m py_compile pipeline.py gui.py community_training.py train_reference_model.py model_manager.py install_optional.py installer/bootstrap_installer_macos.py
          .venv/bin/python -m unittest discover -s tests

      - name: Build macOS installer app
        run: bash build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Voice-Denoise-Splitter-macOS
          path: dist/V-D-Splitter-macOS.zip
